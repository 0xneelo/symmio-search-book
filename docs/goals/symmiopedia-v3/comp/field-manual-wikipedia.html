  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

u002Fh1>\n      <div style=\"font-size: 12.9px; color: #54595d; margin: 5px 0 14px;\">From Symmiopedia, the open ecosystem encyclopedia<\u002Fdiv>\n\n      <sc-if value=\"{{ showHatnote }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size: 13px; font-style: italic; color: #54595d; padding-left: 1.6em; margin-bottom: 10px;\">This article is about the clearing ecosystem. For the clearing layer itself, see <a href=\"#Symmio\" style=\"color: #0645ad; text-decoration: none; font-style: italic;\" style-hover=\"text-decoration: underline;\">Symmio<\u002Fa>. For the reference document, see <a href=\"#References\" style=\"color: #0645ad; text-decoration: none; font-style: italic;\" style-hover=\"text-decoration: underline;\">Vibe × SYMM Field Manual<\u002Fa>.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- infobox -->\n      <div style=\"float: right; clear: right; width: 286px; margin: 4px 0 18px 22px; border: 1px solid #a2a9b1; background: #f8f9fa; padding: 4px; font-size: 12.3px; line-height: 1.5;\">\n        <div style=\"font-size: 15.4px; font-weight: bold; text-align: center; padding: 5px 8px 6px;\">Symmio ecosystem<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: center; padding: 12px 10px 4px;\">\n          <img src=\"c4456291-41d0-4364-9c8a-19ddc3a3bada\" alt=\"Symmio ecosystem puzzle-piece S mark\" width=\"196\" height=\"196\" style=\"display: block; mix-blend-mode: multiply;\">\n        <\u002Fdiv>\n        <div style=\"font-size: 11.7px; color: #54595d; text-align: center; padding: 4px 14px 8px;\">The ecosystem's shared \"S\" mark<\u002Fdiv>\n        <table style=\"width: 100%; border-collapse: collapse; text-align: left;\">\n          <tbody>\n            <tr>\n              <th style=\"vertical-align: top; padding: 3px 8px 3px 4px; width: 88px; font-weight: bold;\">Type<\u002Fth>\n              <td style=\"vertical-align: top; padding: 3px 4px;\">Intent-based clearing network<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <th style=\"vertical-align: top; padding: 3px 8px 3px 4px; font-weight: bold;\">Clearing layer<\u002Fth>\n              <td style=\"vertical-align: top; padding: 3px 4px;\"><a href=\"#Symmio\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Symmio<\u002Fa><\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <th style=\"vertical-align: top; padding: 3px 8px 3px 4px; font-weight: bold;\">Members<\u002Fth>\n              <td style=\"vertical-align: top; padding: 3px 4px;\">\n                <div style=\"display: flex; flex-direction: column; gap: 1px;\">\n                  <a href=\"#Vibe\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Vibe<\u002Fa>\n                  <a href=\"#Symmio\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Symmio<\u002Fa>\n                  <a href=\"#Carbon\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Carbon<\u002Fa>\n                  <a href=\"#Pear\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Pear<\u002Fa>\n                  <a href=\"#Privex\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Privex<\u002Fa>\n                  <a href=\"#Ivy\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Ivy<\u002Fa>\n                <\u002Fdiv>\n              <\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <th style=\"vertical-align: top; padding: 3px 8px 3px 4px; font-weight: bold;\">Settlement<\u002Fth>\n              <td style=\"vertical-align: top; padding: 3px 4px;\">On-chain, bilateral<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <th style=\"vertical-align: top; padding: 3px 8px 3px 4px; font-weight: bold;\">Epoch close<\u002Fth>\n              <td style=\"vertical-align: top; padding: 3px 4px;\">00:00 UTC, daily<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <th style=\"vertical-align: top; padding: 3px 8px 3px 4px; font-weight: bold;\">Website<\u002Fth>\n              <td style=\"vertical-align: top; padding: 3px 4px;\"><a href=\"#\" style=\"color: #3366bb; text-decoration: none;\" style-hover=\"text-decoration: underline;\">symm.example<\u002Fa><\u002Ftd>\n            <\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n      <!-- routed answer -->\n      <sc-if value=\"{{ hasAnswer }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-comment-anchor=\"routed-answer\" style=\"border: 1px solid #a3b0bf; background: #f5faff; margin: 4px 0 18px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px; background: #cedff2; border-bottom: 1px solid #a3b0bf; padding: 5px 12px;\">\n            <span style=\"font-weight: bold; font-size: 12.6px; white-space: nowrap;\">Routed answer<\u002Fspan>\n            <span style=\"flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; font-size: 12.6px; color: #54595d;\">“{{ askedQuestion }}”<\u002Fspan>\n            <span style=\"font-size: 11.7px; color: #54595d; white-space: nowrap;\">[<a href=\"#\" onclick=\"{{ dismissAnswer }}\" title=\"Dismiss this answer\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">dismiss ×<\u002Fa>]<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 12px 18px 14px;\">\n            <div style=\"font-family: 'Linux Libertine', Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 1.3; padding-bottom: 3px; border-bottom: 1px solid #a2a9b1; margin-bottom: 10px;\">Metrics Become Targets In Listing Games<\u002Fdiv>\n            <p style=\"margin: 0 0 12px;\">When market access depends on perceived interest proxies, those proxies become targets. The source lists the usual substitutes for actual demand: community size, engagement, deposits, fees, expected volume, narrative momentum, institutional credibility, and modeled safety. A venue uses those signals because actual interest cannot be observed before a market exists. Projects then optimize for the signals because those signals control access.<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">This is not a minor analytics problem. It changes project behavior. Teams learn to look safer, larger, more active, more liquid, and more inevitable before the market has had a chance to test them. Marketing, social metrics, deposits, partnerships, valuation optics, and venue relationships become part of the listing game.<\u002Fp>\n            <div style=\"font-weight: bold; margin: 0 0 4px;\">The Goodhart problem<\u002Fdiv>\n            <p style=\"margin: 0 0 12px;\">The compendium should explain this as a Goodhart-like loop without overstating it. Metrics are useful until they become the gate. Once they become the gate, the system begins rewarding the appearance of demand alongside, and sometimes ahead of, demand itself. That is why derivative access matters. A live two-sided market produces harder evidence than a pre-listing pro…<\u002Fp>\n            <div style=\"border: 1px dashed #a2a9b1; background: #f8f9fa; padding: 8px 12px; margin: 0 0 12px; font-size: 12.6px; color: #54595d; line-height: 1.55;\"><b style=\"color: #202122;\">Matched chunk:<\u002Fb> <i>“Metrics Become Targets In Listing Games When market access depends on perceived interest proxies, those proxies become targets. The source lists the usual substitutes for actual demand: community size, engagement, deposits, fees, expected volume, narrative momentum, institutional credibility, and modeled safety. A venue uses those signals because actual interest cannot be observed before a market exists. Projects the…”<\u002Fi><\u002Fdiv>\n            <div style=\"font-size: 12.6px; margin: 0 0 6px;\"><b>Source:<\u002Fb>&nbsp;<span style=\"border: 1px solid #a2a9b1; background: #eaecf0; padding: 1px 7px; font-size: 11.7px;\">vibe-papers<\u002Fspan><\u002Fdiv>\n            <ol style=\"margin: 0 0 10px; padding-left: 30px; font-size: 12.3px; line-height: 1.6; display: flex; flex-direction: column; gap: 2px;\">\n              <li><a href=\"https://0xneelo.github.io/vibe_docs/docs/11-gametheory-of-listings/11-docs/02-perceived-vs-actual-interest\" target=\"_blank\" style=\"color: #3366bb; text-decoration: none; word-break: break-all;\" style-hover=\"text-decoration: underline;\">https://0xneelo.github.io/vibe_docs/docs/11-gametheory-of-listings/11-docs/02-perceived-vs-actual-interest<\u002Fa> <span style=\"color: #54595d;\">↗<\u002Fspan><\u002Fli>\n              <li><a href=\"https://0xneelo.github.io/vibe_docs/docs/11-gametheory-of-listings/11-docs/03-the-cost-of-curation\" target=\"_blank\" style=\"color: #3366bb; text-decoration: none; word-break: break-all;\" style-hover=\"text-decoration: underline;\">https://0xneelo.github.io/vibe_docs/docs/11-gametheory-of-listings/11-docs/03-the-cost-of-curation<\u002Fa> <span style=\"color: #54595d;\">↗<\u002Fspan><\u002Fli>\n            <\u002Fol>\n            <div style=\"font-size: 12.6px; margin: 0 0 14px;\"><a href=\"https://0xneelo.github.io/vibe_docs/docs/11-gametheory-of-listings/11-docs/02-perceived-vs-actual-interest\" target=\"_blank\" style=\"color: #3366bb; text-decoration: none; font-weight: bold;\" style-hover=\"text-decoration: underline;\">Open exact page ↗<\u002Fa><\u002Fdiv>\n            <div style=\"border-top: 1px solid #c8ccd1; padding-top: 10px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap;\">\n              <span style=\"font-size: 11px; font-weight: bold; letter-spacing: 1px; color: #54595d;\">RATE THIS ANSWER<\u002Fspan>\n              <button onclick=\"{{ rateDown }}\" style=\"font-family: inherit; font-size: 12.6px; font-weight: bold; padding: 5px 14px; border-radius: 2px; cursor: pointer; background: {{ downBg }}; color: {{ downColor }}; border: 1px solid {{ downBorder }}; opacity: {{ downOpacity }};\">Needs work<\u002Fbutton>\n              <button onclick=\"{{ rateUp }}\" style=\"font-family: inherit; font-size: 12.6px; font-weight: bold; padding: 5px 14px; border-radius: 2px; cursor: pointer; background: {{ upBg }}; color: #ffffff; border: 1px solid {{ upBorder }}; opacity: {{ upOpacity }};\">Useful<\u002Fbutton>\n              <span style=\"display: {{ ratedDisp }}; font-size: 12.3px; color: #14866d;\">✓ logged — thank you<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- article body (hidden while an answer is showing) -->\n      <sc-if value=\"{{ showArticleBody }}\" hint-placeholder-val=\"{{ true }}\">\n      <!-- lead -->\n      <p style=\"margin: 0 0 14px;\">The <b>Symmio ecosystem<\u002Fb> is a network of derivatives trading applications that share a single intent-based clearing layer, <a href=\"#Symmio\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Symmio<\u002Fa>.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[1]<\u002Fa><\u002Fsup> Its member frontends — <a href=\"#Vibe\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Vibe<\u002Fa>, <a href=\"#Carbon\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Carbon<\u002Fa>, <a href=\"#Pear\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Pear<\u002Fa>, <a href=\"#Privex\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Privex<\u002Fa> and <a href=\"#Ivy\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Ivy<\u002Fa> — operate independent products and communities while routing execution, credit and settlement through the shared layer.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[2]<\u002Fa><\u002Fsup><\u002Fp>\n      <p style=\"margin: 0 0 14px;\">Because every member clears through the same engine, fees generated anywhere in the network accrue to one revenue pool and are redistributed at the close of each daily <a href=\"#Points_and_revenue\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">epoch<\u002Fa>.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[3]<\u002Fa><\u002Fsup> The ecosystem is conventionally depicted as a six-piece puzzle globe, one piece per member.<\u002Fp>\n\n      <!-- TOC -->\n      <div style=\"display: inline-block; border: 1px solid #a2a9b1; background: #f8f9fa; padding: 10px 18px 12px; font-size: 13px; margin: 4px 0 14px;\">\n        <div style=\"text-align: center; margin-bottom: 6px;\">\n          <span style=\"font-weight: bold;\">Contents<\u002Fspan>\n          <span style=\"font-size: 11.7px; color: #54595d;\">&nbsp;[<a href=\"#\" onclick=\"{{ toggleToc }}\" style=\"color: #0645ad; text-decoration: none;\">{{ tocLabel }}<\u002Fa>]<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ tocShown }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n            <sc-for list=\"{{ tocItems }}\" as=\"item\" hint-placeholder-count=\"10\">\n              <div style=\"margin-left: {{ item.pad }};\">\n                <a href=\"{{ item.h }}\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\"><span style=\"color: #202122; padding-right: 7px;\">{{ item.n }}<\u002Fspan>{{ item.t }}<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- Overview -->\n      <h2 id=\"Overview\" style=\"font-family: 'Linux Libertine', Georgia, 'Times New Roman', serif; font-size: 22.4px; font-weight: normal; margin: 20px 0 10px; padding-bottom: 3px; border-bottom: 1px solid #a2a9b1;\">Overview<sc-if value=\"{{ showEdit }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; font-family: Helvetica, Arial, sans-serif;\">&nbsp;<span style=\"color: #54595d;\">[<\u002Fspan><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">edit<\u002Fa><span style=\"color: #54595d;\">]<\u002Fspan><\u002Fspan><\u002Fsc-if><\u002Fh2>\n      <p style=\"margin: 0 0 14px;\">Most derivatives venues operate their own order book, margin engine and liquidation stack. Symmio-based venues do not. A member frontend collects a trader's <i>intent<\u002Fi> — the position they want, at the price they will accept — and submits it to the clearing network, where solvers compete to fill it.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[1]<\u002Fa><\u002Fsup> Filled positions settle on-chain as isolated bilateral agreements between trader and solver.<\u002Fp>\n      <p style=\"margin: 0 0 14px;\">The network's documentation describes the design goal as full traceability — \"nothing here is meant to be a black box\" — with every fee split, live counter and routed answer traceable to a published rule.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[4]<\u002Fa><\u002Fsup><\u002Fp>\n\n      <!-- Architecture -->\n      <h2 id=\"Architecture\" style=\"font-family: 'Linux Libertine', Georgia, 'Times New Roman', serif; font-size: 22.4px; font-weight: normal; margin: 20px 0 10px; padding-bottom: 3px; border-bottom: 1px solid #a2a9b1;\">Architecture<sc-if value=\"{{ showEdit }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; font-family: Helvetica, Arial, sans-serif;\">&nbsp;<span style=\"color: #54595d;\">[<\u002Fspan><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">edit<\u002Fa><span style=\"color: #54595d;\">]<\u002Fspan><\u002Fspan><\u002Fsc-if><\u002Fh2>\n\n      <div style=\"float: right; clear: right; width: 218px; border: 1px solid #c8ccd1; background: #f8f9fa; padding: 3px; margin: 4px 0 14px 20px; font-size: 11.9px;\">\n        <div style=\"background: #ffffff; border: 1px solid #eaecf0; padding: 12px 12px;\">\n          <div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px;\">\n            <div style=\"border: 1px solid #a2a9b1; background: #ededed; color: #202122; text-align: center; padding: 5px 4px; font-size: 11px; letter-spacing: 0.5px;\">TRADER<\u002Fdiv>\n            <div style=\"text-align: center; color: #54595d; font-size: 11px; line-height: 1;\">↓<\u002Fdiv>\n            <div style=\"border: 1px solid #a2a9b1; background: #dfdfdf; color: #202122; text-align: center; padding: 5px 4px; font-size: 11px; letter-spacing: 0.5px;\">FRONTEND<\u002Fdiv>\n            <div style=\"text-align: center; color: #54595d; font-size: 11px; line-height: 1;\">↓<\u002Fdiv>\n            <div style=\"border: 1px solid #a2a9b1; background: #c6c6c6; color: #202122; text-align: center; padding: 5px 4px; font-size: 11px; letter-spacing: 0.5px;\">REFERRAL GRAPH<\u002Fdiv>\n            <div style=\"text-align: center; color: #54595d; font-size: 11px; line-height: 1;\">↓<\u002Fdiv>\n            <div style=\"border: 1px solid #a2a9b1; background: #565656; color: #ffffff; text-align: center; padding: 5px 4px; font-size: 11px; letter-spacing: 0.5px;\">SYMM CLEARING<\u002Fdiv>\n            <div style=\"text-align: center; color: #54595d; font-size: 11px; line-height: 1;\">↓<\u002Fdiv>\n            <div style=\"border: 1px solid #a2a9b1; background: #8f8f8f; color: #ffffff; text-align: center; padding: 5px 4px; font-size: 11px; letter-spacing: 0.5px;\">SOLVER / LP<\u002Fdiv>\n            <div style=\"text-align: center; color: #54595d; font-size: 11px; line-height: 1;\">↓<\u002Fdiv>\n            <div style=\"border: 1px solid #a2a9b1; background: #6e6e6e; color: #ffffff; text-align: center; padding: 5px 4px; font-size: 11px; letter-spacing: 0.5px;\">SETTLEMENT<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 5px 6px 3px; color: #202122;\">The intent path. The upper two layers differ per member; the lower four are shared.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin: 0 0 14px;\">An intent passes through six layers between the trader and final settlement. The upper two — the frontend and its referral graph — are operated by each member; the lower four are shared infrastructure operated by the clearing network.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[1]<\u002Fa><\u002Fsup><\u002Fp>\n      <p style=\"margin: 0 0 14px;\">Solvers respond to submitted intents in a competitive auction; the winning quote is bound into a bilateral position between the trader and that solver, collateralised on both sides. Because positions are isolated pairs rather than entries in a common pool, a default affects only its own pair.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[3]<\u002Fa><\u002Fsup><\u002Fp>\n\n      <!-- Members -->\n      <h2 id=\"Member_protocols\" style=\"font-family: 'Linux Libertine', Georgia, 'Times New Roman', serif; font-size: 22.4px; font-weight: normal; margin: 20px 0 10px; padding-bottom: 3px; border-bottom: 1px solid #a2a9b1;\">Member protocols<sc-if value=\"{{ showEdit }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; font-family: Helvetica, Arial, sans-serif;\">&nbsp;<span style=\"color: #54595d;\">[<\u002Fspan><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">edit<\u002Fa><span style=\"color: #54595d;\">]<\u002Fspan><\u002Fspan><\u002Fsc-if><\u002Fh2>\n      <p style=\"margin: 0 0 14px;\">As of July 2026 the ecosystem counts six member protocols.<\u002Fp>\n\n      <h3 id=\"Symmio\" style=\"font-size: 16px; font-weight: bold; margin: 16px 0 6px;\">Symmio<\u002Fh3>\n      <p style=\"margin: 0 0 14px;\">Symmio is the clearing layer itself: an intent-based engine for bilateral OTC derivatives. It matches trader intents with solver quotes and enforces margin and settlement rules for every venue built on top of it.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[2]<\u002Fa><\u002Fsup><\u002Fp>\n\n      <h3 id=\"Vibe\" style=\"font-size: 16px; font-weight: bold; margin: 16px 0 6px;\">Vibe<\u002Fh3>\n      <p style=\"margin: 0 0 14px;\">Vibe is a referral-driven trading network. Its points program credits referrers continuously as fees settle, along a graph of invites documented in the network's <a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Field Manual<\u002Fa>.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[4]<\u002Fa><\u002Fsup><\u002Fp>\n\n      <h3 id=\"Carbon\" style=\"font-size: 16px; font-weight: bold; margin: 16px 0 6px;\">Carbon<\u002Fh3>\n      <p style=\"margin: 0 0 14px;\">Carbon is a terminal-style interface aimed at active traders, exposing the clearing layer's full order and account controls in a single screen.<\u002Fp>\n\n      <h3 id=\"Pear\" style=\"font-size: 16px; font-weight: bold; margin: 16px 0 6px;\">Pear<\u002Fh3>\n      <p style=\"margin: 0 0 14px;\">Pear is a pair-trading venue: one position long one asset and short another, cleared as a single intent.<\u002Fp>\n\n      <h3 id=\"Privex\" style=\"font-size: 16px; font-weight: bold; margin: 16px 0 6px;\">Privex<\u002Fh3>\n      <p style=\"margin: 0 0 14px;\">Privex is a privacy-focused venue; order intents are shielded until settlement to limit information leakage.<sup style=\"font-size: 11px; line-height: 1; font-style: italic;\"><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\">[citation needed]<\u002Fa><\u002Fsup><\u002Fp>\n\n      <h3 id=\"Ivy\" style=\"font-size: 16px; font-weight: bold; margin: 16px 0 6px;\">Ivy<\u002Fh3>\n      <p style=\"margin: 0 0 14px;\">Ivy is the ecosystem's options and structured-products venue, settling option payoffs through the same bilateral accounts as the perpetuals venues.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[5]<\u002Fa><\u002Fsup><\u002Fp>\n\n      <!-- Points and revenue -->\n      <h2 id=\"Points_and_revenue\" style=\"font-family: 'Linux Libertine', Georgia, 'Times New Roman', serif; font-size: 22.4px; font-weight: normal; margin: 20px 0 10px; padding-bottom: 3px; border-bottom: 1px solid #a2a9b1;\">Points and revenue<sc-if value=\"{{ showEdit }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; font-family: Helvetica, Arial, sans-serif;\">&nbsp;<span style=\"color: #54595d;\">[<\u002Fspan><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">edit<\u002Fa><span style=\"color: #54595d;\">]<\u002Fspan><\u002Fspan><\u002Fsc-if><\u002Fh2>\n      <p style=\"margin: 0 0 14px;\">All member frontends charge fees into a common pool. Epochs close daily at 00:00 UTC; at close, the pool is divided according to a fixed schedule and the live counters shown in member frontends reset against settled totals.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[4]<\u002Fa><\u002Fsup><\u002Fp>\n\n      <table style=\"border-collapse: collapse; font-size: 14px; margin: 10px 0 14px;\">\n        <caption style=\"font-weight: bold; padding: 4px; caption-side: top;\">Epoch revenue split<\u002Fcaption>\n        <thead>\n          <tr>\n            <th style=\"border: 1px solid #a2a9b1; background: #eaecf0; padding: 4px 12px; text-align: left;\">Recipient<\u002Fth>\n            <th style=\"border: 1px solid #a2a9b1; background: #eaecf0; padding: 4px 12px; text-align: right;\">Share<\u002Fth>\n            <th style=\"border: 1px solid #a2a9b1; background: #eaecf0; padding: 4px 12px; text-align: left;\">Notes<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px;\">Protocol operations<\u002Ftd>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px; text-align: right;\">34%<\u002Ftd>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px;\">Development and infrastructure<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px;\">Network revenue pool<\u002Ftd>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px; text-align: right;\">30%<\u002Ftd>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px;\">Distributed to points holders<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px;\">Referrer share<\u002Ftd>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px; text-align: right;\">22%<\u002Ftd>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px;\">Paid along the referral graph<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px;\">Trader rebate<\u002Ftd>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px; text-align: right;\">14%<\u002Ftd>\n            <td style=\"border: 1px solid #a2a9b1; padding: 4px 12px;\">Returned pro-rata to fee payers<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <p style=\"margin: 0 0 14px;\">The referrer share is paid along the inviting path of the referral graph, with per-level weights set by tier.<sup style=\"font-size: 11px; line-height: 1;\"><a href=\"#References\" style=\"color: #0645ad; text-decoration: none;\">[4]<\u002Fa><\u002Fsup><\u002Fp>\n\n      <!-- See also -->\n      <h2 id=\"See_also\" style=\"font-family: 'Linux Libertine', Georgia, 'Times New Roman', serif; font-size: 22.4px; font-weight: normal; margin: 20px 0 10px; padding-bottom: 3px; border-bottom: 1px solid #a2a9b1;\">See also<sc-if value=\"{{ showEdit }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; font-family: Helvetica, Arial, sans-serif;\">&nbsp;<span style=\"color: #54595d;\">[<\u002Fspan><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">edit<\u002Fa><span style=\"color: #54595d;\">]<\u002Fspan><\u002Fspan><\u002Fsc-if><\u002Fh2>\n      <ul style=\"margin: 0 0 14px; padding-left: 26px; display: flex; flex-direction: column; gap: 3px;\">\n        <li><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Intent-based execution<\u002Fa><\u002Fli>\n        <li><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Perpetual futures<\u002Fa><\u002Fli>\n        <li><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Request for quote<\u002Fa><\u002Fli>\n        <li><a href=\"#\" style=\"color: #ba0000; text-decoration: none;\" style-hover=\"text-decoration: underline;\" title=\"Page does not exist\">Solver auction<\u002Fa><\u002Fli>\n      <\u002Ful>\n\n      <!-- References -->\n      <h2 id=\"References\" style=\"font-family: 'Linux Libertine', Georgia, 'Times New Roman', serif; font-size: 22.4px; font-weight: normal; margin: 20px 0 10px; padding-bottom: 3px; border-bottom: 1px solid #a2a9b1;\">References<sc-if value=\"{{ showEdit }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; font-family: Helvetica, Arial, sans-serif;\">&nbsp;<span style=\"color: #54595d;\">[<\u002Fspan><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">edit<\u002Fa><span style=\"color: #54595d;\">]<\u002Fspan><\u002Fspan><\u002Fsc-if><\u002Fh2>\n      <ol style=\"margin: 0 0 14px; padding-left: 26px; font-size: 12.6px; line-height: 1.55; display: flex; flex-direction: column; gap: 4px;\">\n        <sc-for list=\"{{ refs }}\" as=\"item\" hint-placeholder-count=\"5\">\n          <li><span style=\"color: #0645ad;\">^<\u002Fspan> \"{{ item.t }}\". <i>{{ item.s }}<\u002Fi> {{ item.d }}<\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n\n      <!-- categories -->\n      <div style=\"margin-top: 28px; border: 1px solid #a2a9b1; background: #f8f9fa; padding: 6px 10px; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center;\">\n        <a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">Categories<\u002Fa><span style=\"margin: 0 8px 0 1px;\">:<\u002Fspan>\n        <sc-for list=\"{{ cats }}\" as=\"item\" hint-placeholder-count=\"4\">\n          <span><a href=\"#\" style=\"color: #0645ad; text-decoration: none;\" style-hover=\"text-decoration: underline;\">{{ item.t }}<\u002Fa><span style=\"color: #54595d; padding: 0 7px;\">{{ item.sep }}<\u002Fspan><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- footer -->\n    <div style=\"padding: 14px 40px 30px 32px; font-size: 12px; color: #202122; line-height: 1.7;\">\n      <div>This page was last edited on 4 July 2026, at 12:47&nbsp;(UTC).<\u002Fdiv>\n      <div>Text is available under the Open Ecosystem License; additional terms may apply. Symmiopedia is a reference mock-up for the rn; }\n    this.setState({ page: 'article', question: q, rated: null, demoDismissed: false });\n    window.scrollTo(0, 0);\n  }\n\n  askFrom(id, e) {\n    const el = document.getElementById(id);\n    this.ask(el ? el.value : '', e);\n  }\n\n  renderVals() {\n    const tocHidden = this.state.tocHidden === null\n      ? !!(this.props.tocCollapsed ?? false)\n      : this.state.tocHidden;\n\n    const page = this.state.page || 'main';\n    const go = (p) => (e) => { if (e) e.preventDefault(); const extra = p === 'article' ? { question: null, rated: null } : {}; this.setState({ page: p, ...extra }); window.scrollTo(0, 0); };\n    const noop = (e) => { if (e) e.preventDefault(); };\n    const goSection = (id) => (e) => {\n      if (e) e.preventDefault();\n      this.setState({ page: 'article', question: null, rated: null });\n      setTimeout(() => {\n        const el = document.getElementById(id);\n        if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.pageYOffset - 8);\n      }, 60);\n    };\n    const exampleQ = 'How do I get more invites?';\n    const demoOn = (this.props.showAnswerDemo ?? false) && !this.state.demoDismissed && !this.state.question;\n    const question = this.state.question || (demoOn ? exampleQ : null);\n    const rated = this.state.rated;\n\n    return {\n      isMain: page === 'main',\n      isArticle: page === 'article',\n      goMain: go('main'),\n      goArticle: go('article'),\n      searchKey: (e) => { if (e.key === 'Enter') this.ask(e.target.value, e); },\n      headerSearchKey: (e) => { if (e.key === 'Enter') this.ask(e.target.value, e); },\n      askMain: (e) => this.askFrom('sp-ask-main', e),\n      askHeader: (e) => this.askFrom('sp-ask-head', e),\n      askExample: (e) => this.ask(exampleQ, e),\n      hasAnswer: page === 'article' && !!question,\n      showArticleBody: !(page === 'article' && !!question),\n      askedQuestion: question || exampleQ,\n      dismissAnswer: (e) => { if (e) e.preventDefault(); this.setState({ question: null, rated: null, demoDismissed: true }); },\n      rateDown: () => this.setState({ rated: 'down' }),\n      rateUp: () => this.setState({ rated: 'up' }),\n      downBg: rated === 'down' ? '#b32424' : '#f8f9fa',\n      downColor: rated === 'down' ? '#ffffff' : '#202122',\n      downBorder: rated === 'down' ? '#b32424' : '#a2a9b1',\n      downOpacity: rated === 'up' ? '0.55' : '1',\n      upBg: rated === 'up' ? '#2a4b8d' : '#3366cc',\n      upBorder: rated === 'up' ? '#2a4b8d' : '#3366cc',\n      upOpacity: rated === 'down' ? '0.55' : '1',\n      ratedDisp: rated ? 'inline' : 'none',\n      showEdit: this.props.showEditLinks ?? true,\n      showHatnote: this.props.showHatnote ?? true,\n      tocShown: !tocHidden,\n      tocLabel: tocHidden ? 'show' : 'hide',\n      toggleToc: (e) => { if (e) e.preventDefault(); this.setState({ tocHidden: !tocHidden }); },\n\n      navPrimary: [\n        { t: 'Main page', click: go('main') },\n        { t: 'Featured article', click: go('article') }\n      ],\n      navEco: [\n        { t: 'Vibe', h: '#Vibe', click: goSection('Vibe') },\n        { t: 'Symmio', h: '#Symmio', click: goSection('Symmio') },\n        { t: 'Carbon', h: '#Carbon', click: goSection('Carbon') },\n        { t: 'Pear', h: '#Pear', click: goSection('Pear') },\n        { t: 'Privex', h: '#Privex', click: goSection('Privex') },\n        { t: 'Ivy', h: '#Ivy', click: goSection('Ivy') }\n      ],\n      navTools: [\n        { t: 'Printable version', click: (e) => { if (e) e.preventDefault(); window.print(); } }\n      ],\n      tocItems: [\n        { n: '1', t: 'Overview', h: '#Overview', pad: '0px' },\n        { n: '2', t: 'Architecture', h: '#Architecture', pad: '0px' },\n        { n: '3', t: 'Member protocols', h: '#Member_protocols', pad: '0px' },\n        { n: '3.1', t: 'Symmio', h: '#Symmio', pad: '22px' },\n        { n: '3.2', t: 'Vibe', h: '#Vibe', pad: '22px' },\n        { n: '3.3', t: 'Carbon', h: '#Carbon', pad: '22px' },\n        { n: '3.4', t: 'Pear', h: '#Pear', pad: '22px' },\n        { n: '3.5', t: 'Privex', h: '#Privex', pad: '22px' },\n        { n: '3.6', t: 'Ivy', h: '#Ivy', pad: '22px' },\n        { n: '4', t: 'Points and revenue', h: '#Points_and_revenue', pad: '0px' },\n        { n: '5', t: 'See also', h: '#See_also', pad: '0px' },\n        { n: '6', t: 'References', h: '#References', pad: '0px' }\n      ],\n      refs: [\n        { t: 'The Field Manual, §01: Network stack', s: 'Vibe × SYMM. Rev 2026.06.', d: 'Retrieved 4 July 2026.' },\n        { t: 'Six pieces, one ball: an ecosystem map', s: 'Symmio documentation.', d: 'Retrieved 4 July 2026.' },\n        { t: 'Intent lifecycle and epoch accounting', s: 'SYMM clearing specification.', d: 'Retrieved 3 July 2026.' },\n        { t: 'The Field Manual, §03: Revenue', s: 'Vibe × SYMM. Rev 2026.06.', d: 'Retrieved 4 July 2026.' },\n        { t: 'The shared-pool thesis', s: 'Clearing Weekly.', d: '12 June 2026.' }\n      ],\n      cats: [\n        { t: 'Clearing networks', sep: '|' },\n        { t: 'Derivatives', sep: '|' },\n        { t: 'Trading frontends', sep: '|' },\n        { t: 'Intent-based protocols', sep: '' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
