document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rue\" viewBox=\"0 0 512 435\" width=\"18\" height=\"15\" fill=\"none\" style=\"flex:none;display:block\"><rect x=\"20\" y=\"178\" width=\"79\" height=\"237\" stroke=\"currentColor\" stroke-width=\"40\"><\u002Frect><rect x=\"158\" y=\"158\" width=\"39\" height=\"237\" fill=\"currentColor\"><\u002Frect><rect x=\"473\" y=\"158\" width=\"39\" height=\"197\" fill=\"currentColor\"><\u002Frect><rect x=\"197\" y=\"118\" width=\"40\" height=\"40\" fill=\"currentColor\"><\u002Frect><rect x=\"434\" y=\"356\" width=\"38\" height=\"39\" fill=\"currentColor\"><\u002Frect><rect x=\"236\" y=\"79\" width=\"40\" height=\"39\" fill=\"currentColor\"><\u002Frect><rect x=\"276\" width=\"39\" height=\"78\" fill=\"currentColor\"><\u002Frect><rect x=\"315\" width=\"79\" height=\"39\" fill=\"currentColor\"><\u002Frect><rect x=\"355\" y=\"39\" width=\"39\" height=\"79\" fill=\"currentColor\"><\u002Frect><rect x=\"315\" y=\"118\" width=\"158\" height=\"40\" fill=\"currentColor\"><\u002Frect><rect x=\"198\" y=\"395\" width=\"235\" height=\"40\" fill=\"currentColor\"><\u002Frect><\u002Fsvg>USEFUL<\u002Fbutton>\n                      <span style=\"display:{{ ratedDisp }};font-family:'Poppins',sans-serif;font-weight:600;font-size:11.5px;color:var(--ink,#f04fd6)\">✓ logged — thank you<\u002Fspan>\n                      <button onclick=\"{{ clearAnswer }}\" style=\"background:transparent;border:none;font-family:'Poppins',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.5px;padding:7px 6px;cursor:pointer;color:#8fa0d8;margin-left:auto\">DISMISS ×<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ WHY WE NEED A MANUAL ============ -->\n        <div data-pshell=\"\" style=\"display:{{ whyDisp }}\">\n        <div data-page=\"why\">\n          <h1 style=\"margin:0;font-family:'Poppins',sans-serif;font-weight:700;font-size:52px;letter-spacing:-2.2px;color:#ffffff\">Why we need a manual<span style=\"color:var(--ink,#f04fd6)\">?<\u002Fspan><\u002Fh1>\n          <div style=\"height:6px;background-image:repeating-linear-gradient(90deg,rgba(126,160,255,0.55) 0 12px,transparent 12px 24px);margin:22px 0 30px\"><\u002Fdiv>\n          <div style=\"columns:2;column-gap:46px;max-width:880px\">\n            <p class=\"dropcap\" style=\"margin:0 0 16px;font-size:15.5px;line-height:1.75;color:#d3dbff\">Before and between the moment a trade is placed and the moment a payout lands, a lot happens. This manual takes that path apart, layer by layer, the frontend you click, the referral graph that records who brought whom, the SYMM clearing layer that settles the fill, and the revenue that flows back to you. Nothing here is meant to be a black box.<\u002Fp>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.75;color:#d3dbff\">Read it like a reference, not a story. Jump to a chapter from the index, or ask the manual a direct question on the cover, it routes to the same indexed figures that power the live answers.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"position:relative;border:1.5px dashed rgba(255,255,255,0.3);background-image:linear-gradient(var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px),linear-gradient(90deg,var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px);background-size:22px 22px;padding:44px 28px 34px;margin-top:40px;overflow:hidden\">\n              <div style=\"position:absolute;top:14px;left:14px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:#8fa0d8\">FIG_001<\u002Fdiv>\n              <div style=\"position:absolute;top:14px;right:14px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:#5f6cb0\">[ VIBE NETWORK STACK ]<\u002Fdiv>\n              <svg viewBox=\"0 0 1560 400\" style=\"display:block;width:100%;margin:0 auto;overflow:visible\">\n                <line x1=\"60\" y1=\"230\" x2=\"1500\" y2=\"230\" style=\"stroke:var(--ink,#f04fd6)\" stroke-width=\"1\" stroke-dasharray=\"2 5\" opacity=\"0.4\"><\u002Fline>\n                <g class=\"stk-layer\" style=\"animation-delay:0.26s\">\n                  <g class=\"stk-float\" style=\"animation-delay:0s\">\n                    <path class=\"stk-face\" d=\"M52,230 L140,276 L140,292 L52,246 Z\" fill=\"{{ L1.f1 }}\" stroke=\"{{ L1.stroke }}\" stroke-width=\"{{ L1.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M228,230 L140,276 L140,292 L228,246 Z\" fill=\"{{ L1.f2 }}\" stroke=\"{{ L1.stroke }}\" stroke-width=\"{{ L1.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M140,184 L228,230 L140,276 L52,230 Z\" fill=\"{{ L1.f3 }}\" stroke=\"{{ L1.stroke }}\" stroke-width=\"{{ L1.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                  <\u002Fg>\n                  <circle cx=\"140\" cy=\"230\" r=\"3\" style=\"fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                  <text class=\"stk-lname\" x=\"140\" y=\"150\" text-anchor=\"middle\" font-family=\"'Poppins',sans-serif\" font-size=\"14\" font-weight=\"{{ L1.nameW }}\" fill=\"{{ L1.nameFill }}\">TRADER<\u002Ftext>\n                  <text class=\"stk-lsub\" x=\"140\" y=\"332\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"12\" fill=\"{{ L1.subFill }}\">01 / you, signing intents<\u002Ftext>\n                <\u002Fg>\n                <g class=\"stk-layer\" style=\"animation-delay:0.355s\">\n                  <g class=\"stk-float\" style=\"animation-delay:0.4s\">\n                    <path class=\"stk-face\" d=\"M308,230 L396,276 L396,292 L308,246 Z\" fill=\"{{ L2.f1 }}\" stroke=\"{{ L2.stroke }}\" stroke-width=\"{{ L2.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M484,230 L396,276 L396,292 L484,246 Z\" fill=\"{{ L2.f2 }}\" stroke=\"{{ L2.stroke }}\" stroke-width=\"{{ L2.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M396,184 L484,230 L396,276 L308,230 Z\" fill=\"{{ L2.f3 }}\" stroke=\"{{ L2.stroke }}\" stroke-width=\"{{ L2.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                  <\u002Fg>\n                  <circle cx=\"396\" cy=\"230\" r=\"3\" style=\"fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                  <text class=\"stk-lname\" x=\"396\" y=\"150\" text-anchor=\"middle\" font-family=\"'Poppins',sans-serif\" font-size=\"14\" font-weight=\"{{ L2.nameW }}\" fill=\"{{ L2.nameFill }}\">VIBE FRONTEND<\u002Ftext>\n                  <text class=\"stk-lsub\" x=\"396\" y=\"332\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"12\" fill=\"{{ L2.subFill }}\">02 / what you click<\u002Ftext>\n                <\u002Fg>\n                <g class=\"stk-layer\" style=\"animation-delay:0.45s\">\n                  <g class=\"stk-float\" style=\"animation-delay:0.8s\">\n                    <path class=\"stk-face\" d=\"M564,230 L652,276 L652,292 L564,246 Z\" fill=\"{{ L3.f1 }}\" stroke=\"{{ L3.stroke }}\" stroke-width=\"{{ L3.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M740,230 L652,276 L652,292 L740,246 Z\" fill=\"{{ L3.f2 }}\" stroke=\"{{ L3.stroke }}\" stroke-width=\"{{ L3.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M652,184 L740,230 L652,276 L564,230 Z\" fill=\"{{ L3.f3 }}\" stroke=\"{{ L3.stroke }}\" stroke-width=\"{{ L3.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                  <\u002Fg>\n                  <circle cx=\"652\" cy=\"230\" r=\"3\" style=\"fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                  <text class=\"stk-lname\" x=\"652\" y=\"150\" text-anchor=\"middle\" font-family=\"'Poppins',sans-serif\" font-size=\"14\" font-weight=\"{{ L3.nameW }}\" fill=\"{{ L3.nameFill }}\">REFERRAL GRAPH<\u002Ftext>\n                  <text class=\"stk-lsub\" x=\"652\" y=\"332\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"12\" fill=\"{{ L3.subFill }}\">03 / who brought whom<\u002Ftext>\n                <\u002Fg>\n                <g class=\"stk-layer\" style=\"animation-delay:0.545s\">\n                  <g class=\"stk-float\" style=\"animation-delay:1.2s\">\n                    <path class=\"stk-face\" d=\"M820,230 L908,276 L908,292 L820,246 Z\" fill=\"{{ L4.f1 }}\" stroke=\"{{ L4.stroke }}\" stroke-width=\"{{ L4.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M996,230 L908,276 L908,292 L996,246 Z\" fill=\"{{ L4.f2 }}\" stroke=\"{{ L4.stroke }}\" stroke-width=\"{{ L4.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M908,184 L996,230 L908,276 L820,230 Z\" fill=\"{{ L4.f3 }}\" stroke=\"{{ L4.stroke }}\" stroke-width=\"{{ L4.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                  <\u002Fg>\n                  <circle cx=\"908\" cy=\"230\" r=\"3\" style=\"fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                  <text class=\"stk-lname\" x=\"908\" y=\"150\" text-anchor=\"middle\" font-family=\"'Poppins',sans-serif\" font-size=\"14\" font-weight=\"{{ L4.nameW }}\" fill=\"{{ L4.nameFill }}\">SYMM CLEARING<\u002Ftext>\n                  <text class=\"stk-lsub\" x=\"908\" y=\"332\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"12\" fill=\"{{ L4.subFill }}\">04 / where fills settle<\u002Ftext>\n                <\u002Fg>\n                <g class=\"stk-layer\" style=\"animation-delay:0.64s\">\n                  <g class=\"stk-float\" style=\"animation-delay:1.6s\">\n                    <path class=\"stk-face\" d=\"M1076,230 L1164,276 L1164,292 L1076,246 Z\" fill=\"{{ L5.f1 }}\" stroke=\"{{ L5.stroke }}\" stroke-width=\"{{ L5.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M1252,230 L1164,276 L1164,292 L1252,246 Z\" fill=\"{{ L5.f2 }}\" stroke=\"{{ L5.stroke }}\" stroke-width=\"{{ L5.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M1164,184 L1252,230 L1164,276 L1076,230 Z\" fill=\"{{ L5.f3 }}\" stroke=\"{{ L5.stroke }}\" stroke-width=\"{{ L5.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                  <\u002Fg>\n                  <circle cx=\"1164\" cy=\"230\" r=\"3\" style=\"fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                  <text class=\"stk-lname\" x=\"1164\" y=\"150\" text-anchor=\"middle\" font-family=\"'Poppins',sans-serif\" font-size=\"14\" font-weight=\"{{ L5.nameW }}\" fill=\"{{ L5.nameFill }}\">SOLVER / LP<\u002Ftext>\n                  <text class=\"stk-lsub\" x=\"1164\" y=\"332\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"12\" fill=\"{{ L5.subFill }}\">05 / best bid wins<\u002Ftext>\n                <\u002Fg>\n                <g class=\"stk-layer\" style=\"animation-delay:0.735s\">\n                  <g class=\"stk-float\" style=\"animation-delay:2s\">\n                    <path class=\"stk-face\" d=\"M1332,230 L1420,276 L1420,292 L1332,246 Z\" fill=\"{{ L6.f1 }}\" stroke=\"{{ L6.stroke }}\" stroke-width=\"{{ L6.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M1508,230 L1420,276 L1420,292 L1508,246 Z\" fill=\"{{ L6.f2 }}\" stroke=\"{{ L6.stroke }}\" stroke-width=\"{{ L6.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <path class=\"stk-face\" d=\"M1420,184 L1508,230 L1420,276 L1332,230 Z\" fill=\"{{ L6.f3 }}\" stroke=\"{{ L6.stroke }}\" stroke-width=\"{{ L6.sw }}\" stroke-linejoin=\"round\"><\u002Fpath>\n                  <\u002Fg>\n                  <circle cx=\"1420\" cy=\"230\" r=\"3\" style=\"fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                  <text class=\"stk-lname\" x=\"1420\" y=\"150\" text-anchor=\"middle\" font-family=\"'Poppins',sans-serif\" font-size=\"14\" font-weight=\"{{ L6.nameW }}\" fill=\"{{ L6.nameFill }}\">SETTLEMENT<\u002Ftext>\n                  <text class=\"stk-lsub\" x=\"1420\" y=\"332\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"12\" fill=\"{{ L6.subFill }}\">06 / on-chain finality<\u002Ftext>\n                <\u002Fg>\n              <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ GETTING STARTED ============ -->\n        <div data-pshell=\"\" style=\"display:{{ startDisp }}\">\n        <div data-page=\"start\">\n          <h1 style=\"margin:0;font-family:'Poppins',sans-serif;font-weight:700;font-size:52px;letter-spacing:-2.2px;color:#ffffff\">Getting started<span style=\"color:var(--ink,#f04fd6)\">.<\u002Fspan><\u002Fh1>\n          <div style=\"height:6px;background-image:repeating-linear-gradient(90deg,rgba(126,160,255,0.55) 0 12px,transparent 12px 24px);margin:22px 0 30px\"><\u002Fdiv>\n          <div style=\"columns:2;column-gap:46px;max-width:880px\">\n            <p class=\"dropcap\" style=\"margin:0 0 16px;font-size:15.5px;line-height:1.75;color:#d3dbff\">Vibe is a trading network built on top of the SYMM clearing layer. You trade, you invite, and a share of the fees your network generates routes back to you. Three nouns carry most of the weight in these pages: the <em>epoch<\u002Fem>, the <em>graph<\u002Fem>, and the <em>fill<\u002Fem>.<\u002Fp>\n            <p style=\"margin:0 0 16px;font-size:15.5px;line-height:1.75;color:#d3dbff\">An epoch is the accounting window. It opens, volume accrues, and at 00:00 UTC it closes and finalizes. Points and revenue are provisional until that close — everything in this manual is timed to it.<\u002Fp>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.75;color:#d3dbff\">The graph is who you brought in. The fill is a trade that has actually settled. Keep these three straight and the rest of the manual reads cleanly.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:40px;position:relative;border:1.5px dashed rgba(255,255,255,0.3);background-image:linear-gradient(var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px),linear-gradient(90deg,var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px);background-size:22px 22px;padding:34px 40px 30px;max-width:880px\">\n            <div style=\"position:absolute;top:12px;left:12px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:#8fa0d8\">FIG_010 — THE EPOCH<\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:0;margin-top:18px;position:relative\">\n              <div style=\"position:absolute;left:0;right:0;bottom:18px;height:1.5px;background:rgba(255,255,255,0.5)\"><\u002Fdiv>\n              <div style=\"position:relative;flex:1;text-align:center;padding-bottom:30px\"><div style=\"width:13px;height:13px;border:2px solid #7ea0ff;background:var(--paper,#05070f);border-radius:50%;margin:0 auto;position:relative;z-index:1\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:11px;color:#cdd8ff;margin-top:14px\">OPEN<\u002Fdiv><\u002Fdiv>\n              <div style=\"position:relative;flex:2;text-align:center;padding-bottom:30px\"><div style=\"width:13px;height:13px;border:2px solid #7ea0ff;background:var(--paper,#05070f);border-radius:50%;margin:0 auto\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:11px;color:#cdd8ff;margin-top:14px\">ACCRUE VOLUME<\u002Fdiv><\u002Fdiv>\n              <div style=\"position:relative;flex:1;text-align:center;padding-bottom:30px\"><div style=\"width:13px;height:13px;background:var(--ink,#f04fd6);border:2px solid var(--ink,#f04fd6);border-radius:50%;margin:0 auto\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--ink,#f04fd6);margin-top:14px\">CLOSE 00:00 UTC<\u002Fdiv><\u002Fdiv>\n              <div style=\"position:relative;flex:1;text-align:center;padding-bottom:30px\"><div style=\"width:13px;height:13px;border:2px solid #7ea0ff;background:var(--paper,#05070f);border-radius:50%;margin:0 auto\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:11px;color:#cdd8ff;margin-top:14px\">FINALIZE<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:22px 0 0;font-family:'Space Mono',monospace;font-size:11px;color:#8fa0d8;letter-spacing:0.3px\">Provisional balances revise until CLOSE; they are immutable after FINALIZE.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ REWARDS & REFERRALS ============ -->\n        <div data-pshell=\"\" style=\"display:{{ rewardsDisp }}\">\n        <div data-page=\"rewards\">\n          <h1 style=\"margin:0;font-family:'Poppins',sans-serif;font-weight:700;font-size:48px;letter-spacing:-2.2px;color:#ffffff\">Rewards &amp; referrals<span style=\"color:var(--ink,#f04fd6)\">.<\u002Fspan><\u002Fh1>\n          <div style=\"height:6px;background-image:repeating-linear-gradient(90deg,rgba(126,160,255,0.55) 0 12px,transparent 12px 24px);margin:22px 0 30px\"><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:46px;align-items:start\">\n            <div>\n              <p class=\"dropcap\" style=\"margin:0 0 16px;font-size:15.5px;line-height:1.75;color:#d3dbff\">Your referral graph is the record of who you brought to the network and who they brought in turn. It is directional and it compounds: activity two hops away still touches your balance, attenuated by depth and by tier.<\u002Fp>\n              <p style=\"margin:0 0 16px;font-size:15.5px;line-height:1.75;color:#d3dbff\">Points accrue from your graph’s trading and settle at each epoch close. Invite slots are not fixed — active invitees unlock more each epoch; dormant branches return nothing.<\u002Fp>\n              <p style=\"margin:0;font-size:15.5px;line-height:1.75;color:#d3dbff\">The figure opposite traces a single point from an invitee, back through the graph, to you. Each hop is a discount, never a dead end.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"position:relative;border:1.5px dashed rgba(255,255,255,0.3);background-image:linear-gradient(var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px),linear-gradient(90deg,var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px);background-size:22px 22px;padding:26px 8px 18px\">\n              <div style=\"position:absolute;top:12px;left:12px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:#8fa0d8\">FIG_021 — REFERRAL GRAPH<\u002Fdiv>\n              <svg viewBox=\"0 0 540 440\" style=\"display:block;width:100%;margin:14px auto 0;overflow:visible\">\n                <g style=\"stroke:var(--ink,#f04fd6)\" stroke-width=\"1.4\" stroke-dasharray=\"3 4\" fill=\"none\">\n                  <line x1=\"90\" y1=\"220\" x2=\"250\" y2=\"100\"><\u002Fline>\n                  <line x1=\"90\" y1=\"220\" x2=\"250\" y2=\"220\"><\u002Fline>\n                  <line x1=\"90\" y1=\"220\" x2=\"250\" y2=\"340\"><\u002Fline>\n                  <line x1=\"250\" y1=\"100\" x2=\"440\" y2=\"142\"><\u002Fline>\n                  <line x1=\"250\" y1=\"340\" x2=\"440\" y2=\"298\"><\u002Fline>\n                <\u002Fg>\n                <g font-family=\"'Space Mono',monospace\" font-size=\"10\" style=\"fill:var(--ink,#f04fd6)\">\n                  <text x=\"168\" y=\"150\" text-anchor=\"middle\">+pts<\u002Ftext>\n                  <text x=\"172\" y=\"200\" text-anchor=\"middle\">+pts<\u002Ftext>\n                  <text x=\"168\" y=\"298\" text-anchor=\"middle\">+pts<\u002Ftext>\n                <\u002Fg>\n                <g>\n                  <circle cx=\"440\" cy=\"142\" r=\"20\" style=\"fill:color-mix(in srgb,var(--paper,#05070f) 68%,#2e6bff);stroke:#7ea0ff\" stroke-width=\"1.6\"><\u002Fcircle>\n                  <text x=\"440\" y=\"146\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"10\" fill=\"#cdd8ff\">L2<\u002Ftext>\n                  <circle cx=\"440\" cy=\"298\" r=\"20\" style=\"fill:color-mix(in srgb,var(--paper,#05070f) 68%,#2e6bff);stroke:#7ea0ff\" stroke-width=\"1.6\"><\u002Fcircle>\n                  <text x=\"440\" y=\"302\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"10\" fill=\"#cdd8ff\">L2<\u002Ftext>\n                  <circle cx=\"250\" cy=\"100\" r=\"24\" style=\"fill:color-mix(in srgb,var(--paper,#05070f) 55%,#2e6bff);stroke:#7ea0ff\" stroke-width=\"2\"><\u002Fcircle>\n                  <text x=\"250\" y=\"104\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"11\" fill=\"#ffffff\">L1<\u002Ftext>\n                  <circle cx=\"250\" cy=\"220\" r=\"24\" style=\"fill:color-mix(in srgb,var(--paper,#05070f) 55%,#2e6bff);stroke:#7ea0ff\" stroke-width=\"2\"><\u002Fcircle>\n                  <text x=\"250\" y=\"224\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"11\" fill=\"#ffffff\">L1<\u002Ftext>\n                  <circle cx=\"250\" cy=\"340\" r=\"24\" style=\"fill:color-mix(in srgb,var(--paper,#05070f) 55%,#2e6bff);stroke:#7ea0ff\" stroke-width=\"2\"><\u002Fcircle>\n                  <text x=\"250\" y=\"344\" text-anchor=\"middle\" font-family=\"'Space Mono',monospace\" font-size=\"11\" fill=\"#ffffff\">L1<\u002Ftext>\n                  <circle cx=\"90\" cy=\"220\" r=\"30\" style=\"fill:var(--ink,#f04fd6);stroke:#ffffff\" stroke-width=\"2\"><\u002Fcircle>\n                  <text x=\"90\" y=\"224\" text-anchor=\"middle\" font-family=\"'Poppins',sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#fff\">YOU<\u002Ftext>\n                <\u002Fg>\n                <circle class=\"rg-pulse\" r=\"4\" cx=\"250\" cy=\"100\" style=\"--tx:-160px;--ty:120px;animation-delay:0s;fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                <circle class=\"rg-pulse\" r=\"4\" cx=\"250\" cy=\"220\" style=\"--tx:-160px;--ty:0px;animation-delay:0.3s;fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                <circle class=\"rg-pulse\" r=\"4\" cx=\"250\" cy=\"340\" style=\"--tx:-160px;--ty:-120px;animation-delay:0.6s;fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                <circle class=\"rg-pulse\" r=\"4\" cx=\"440\" cy=\"142\" style=\"--tx:-190px;--ty:-42px;animation-delay:0.15s;fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n                <circle class=\"rg-pulse\" r=\"4\" cx=\"440\" cy=\"298\" style=\"--tx:-190px;--ty:42px;animation-delay:0.45s;fill:var(--ink,#f04fd6)\"><\u002Fcircle>\n              <\u002Fsvg>\n              <p style=\"margin:6px 14px 4px;font-family:'Space Mono',monospace;font-size:11px;color:#8fa0d8\">L1 direct invitees · L2 second-hop · points attenuate per hop<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ NETWORK REVENUE ============ -->\n        <div data-pshell=\"\" style=\"display:{{ revenueDisp }}\">\n        <div data-page=\"revenue\">\n          <h1 style=\"margin:0;font-family:'Poppins',sans-serif;font-weight:700;font-size:52px;letter-spacing:-2.2px;color:#ffffff\">Network revenue<span style=\"color:var(--ink,#f04fd6)\">.<\u002Fspan><\u002Fh1>\n          <div style=\"height:6px;background-image:repeating-linear-gradient(90deg,rgba(126,160,255,0.55) 0 12px,transparent 12px 24px);margin:22px 0 30px\"><\u002Fdiv>\n          <div style=\"columns:2;column-gap:46px;max-width:880px;margin-bottom:36px\">\n            <p class=\"dropcap\" style=\"margin:0 0 16px;font-size:15.5px;line-height:1.75;color:#d3dbff\">Every trade pays a protocol fee. That fee does not vanish into one pocket — it is split, and one of the slices routes back to the network that produced the volume. This is the figure that decides your payout.<\u002Fp>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.75;color:#d3dbff\">The gross fee is divided between protocol operations, the network revenue pool, the referrer share, and the trader rebate. Your cut of the pool is weighted by tier and netted against solver rebates. The proportions below are illustrative — your live split is on the dashboard.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"position:relative;border:1.5px dashed rgba(255,255,255,0.3);background-image:linear-gradient(var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px),linear-gradient(90deg,var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px);background-size:22px 22px;padding:34px 40px 30px;max-width:980px\">\n            <div style=\"position:absolute;top:12px;left:12px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:#8fa0d8\">FIG_031 — NETWORK REVENUE SPLIT<\u002Fdiv>\n            <div style=\"margin-top:20px;display:flex;height:42px;border:2px solid rgba(255,255,255,0.35);align-items:center;justify-content:center;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.14) 0 1px,transparent 1px 8px)\">\n              <span style=\"font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;color:#ffffff;background:var(--paper,#05070f);padding:2px 12px\">GROSS TRADING FEE &nbsp;/&nbsp; 100%<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"text-align:center;font-family:'Space Mono',monospace;font-size:14px;color:#8fa0d8;margin:6px 0\">↓<\u002Fdiv>\n            <div style=\"display:flex;border:2px solid rgba(255,255,255,0.35)\">\n              <div style=\"flex:34 1 0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;border-right:2px solid rgba(255,255,255,0.35);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.12) 0 1px,transparent 1px 8px)\"><span style=\"font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:0.5px;color:#ffffff\">PROTOCOL OPS<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:30 1 0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;border-right:2px solid rgba(255,255,255,0.35);background:var(--ink,#f04fd6)\"><span style=\"font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:0.5px;color:#fff\">NETWORK REVENUE POOL<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:22 1 0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;border-right:2px solid rgba(255,255,255,0.35);background:#2e6bff\"><span style=\"font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:0.5px;color:#fff\">REFERRER SHARE<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:14 1 0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.12) 0 1px,transparent 1px 8px)\"><span style=\"font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:0.5px;color:#ffffff\">TRADER REBATE<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.14)\">\n              <div style=\"font-family:'Space Mono',monospace;font-size:14px;letter-spacing:0.3px;color:#ffffff\">net_revenue<span style=\"color:var(--ink,#f04fd6)\">ℹ<\u002Fspan> &nbsp;=&nbsp; Σ ( vol<sub>graph<\u002Fsub> · fee_rate · tier<span style=\"color:var(--ink,#f04fd6)\">ℹ<\u002Fspan> ) &nbsp;−&nbsp; solver_rebate<\u002Fdiv>\n              <div style=\"font-family:'Space Mono',monospace;font-size:11px;color:#8fa0d8;margin-top:10px\">Pool share is tier-weighted; settled fills only. Proportions illustrative.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ SYMM CLEARING ============ -->\n        <div data-pshell=\"\" style=\"display:{{ symmDisp }}\">\n        <div data-page=\"symm\">\n          <h1 style=\"margin:0;font-family:'Poppins',sans-serif;font-weight:700;font-size:52px;letter-spacing:-2.2px;color:#ffffff\">SYMM clearing<span style=\"color:var(--ink,#f04fd6)\">.<\u002Fspan><\u002Fh1>\n          <div style=\"height:6px;background-image:repeating-linear-gradient(90deg,rgba(126,160,255,0.55) 0 12px,transparent 12px 24px);margin:22px 0 30px\"><\u002Fdiv>\n          <div style=\"columns:2;column-gap:46px;max-width:880px;margin-bottom:38px\">\n            <p class=\"dropcap\" style=\"margin:0 0 16px;font-size:15.5px;line-height:1.75;color:#d3dbff\">SYMM is the layer underneath everything Vibe shows you. It is an intent-based clearing system for perpetuals: you express what you want, solvers compete to fill it, and the result is settled on-chain with finality.<\u002Fp>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.75;color:#d3dbff\">Vibe never custodies your position — it routes intents to SYMM and reads settled state back. When the live counter pauses, it is usually waiting on this layer to finalize a block. That wait is a property of settlement, not a fault in the counter.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"position:relative;border:1.5px dashed rgba(255,255,255,0.3);background-image:linear-gradient(var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px),linear-gradient(90deg,var(--gridc,rgba(255,255,255,0.07)) 1px,transparent 1px);background-size:22px 22px;padding:34px 40px 34px;max-width:880px\">\n            <div style=\"position:absolute;top:12px;left:12px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:#8fa0d8\">FIG_041 — INTENT LIFECYCLE<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:0;margin-top:20px;flex-wrap:nowrap\">\n              <div style=\"flex:1;border:2px solid rgba(255,255,255,0.3);background:color-mix(in srgb,var(--paper,#05070f) 70%,#2e6bff);box-shadow:0 4px 0 rgba(0,0,0,0.4);padding:20px 12px;text-align:center\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.5px;color:#ffffff\">INTENT<\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:10px;color:#aebaf0;margin-top:6px\">signed by you<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family:'Space Mono',monospace;color:var(--ink,#f04fd6);padding:0 14px;font-size:16px\">→<\u002Fdiv>\n              <div style=\"flex:1.3;border:2px solid #2e6bff;background:#2e6bff;box-shadow:0 4px 0 rgba(0,0,0,0.45);padding:20px 12px;text-align:center\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.5px;color:#fff\">SOLVER AUCTION<\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:10px;color:rgba(255,255,255,0.85);margin-top:6px\">best bid wins<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family:'Space Mono',monospace;color:var(--ink,#f04fd6);padding:0 14px;font-size:16px\">→<\u002Fdiv>\n              <div style=\"flex:1;border:2px solid rgba(255,255,255,0.3);background:color-mix(in srgb,var(--paper,#05070f) 70%,#2e6bff);box-shadow:0 4px 0 rgba(0,0,0,0.4);padding:20px 12px;text-align:center\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.5px;color:#ffffff\">SETTLEMENT<\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:10px;color:#aebaf0;margin-top:6px\">on-chain finality<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:22px 0 0;font-family:'Space Mono',monospace;font-size:11px;color:#8fa0d8\">Counter advances only after SETTLEMENT reaches finality.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ GLOSSARY ============ -->\n        <div data-pshell=\"\" style=\"display:{{ glossaryDisp }}\">\n        <div data-page=\"glossary\">\n          <h1 style=\"margin:0;font-family:'Poppins',sans-serif;font-weight:700;font-size:54px;letter-spacing:-2.2px;color:#ffffff\">Glossary<span style=\"color:var(--ink,#f04fd6)\">.<\u002Fspan><\u002Fh1>\n          <div style=\"height:6px;background-image:repeating-linear-gradient(90deg,rgba(126,160,255,0.55) 0 12px,transparent 12px 24px);margin:22px 0 30px\"><\u002Fdiv>\n          <div style=\"max-width:900px;border-top:1px solid rgba(255,255,255,0.14)\">\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">EPOCH<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">The accounting window. Opens, accrues volume, then closes and finalizes at 00:00 UTC. Points and revenue are provisional until close.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">REFERRAL GRAPH<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">The directional record of who you invited and who they invited, across multiple hops.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">NETWORK REVENUE<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">Your tier-weighted share of protocol fees generated by your graph, net of solver rebates.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">FILL<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">A trade matched and settled on the clearing layer. Only settled fills are final; pending ones are provisional.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">SOLVER<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">A competing party that bids to fill your intent on SYMM. The best bid wins the auction.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">INTENT<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">A signed expression of the trade you want, routed to solvers rather than to a fixed order book.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">CLEARING LAYER<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">SYMM — the settlement system underneath Vibe that finalizes fills on-chain.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">TIER<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">Your standing in the network. Higher tiers raise your revenue weight and invite allocation.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">FINALITY<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">The point at which a fill can no longer revise. Provisional state precedes it.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">INVITE SLOT<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">A single allocation that lets you bring one new member. Earned per epoch from an active graph.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.12)\"><div style=\"font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--ink,#f04fd6)\">ROUTED ANSWER<\u002Fdiv><div style=\"font-size:15px;line-height:1.65;color:#d3dbff\">A docs reply matched to the nearest indexed figure, returned with its source and a confidence band.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div onclick=\"{{ cancelConfirm }}\" style=\"display:{{ confirmDisp }};position:fixed;inset:0;background:rgba(2,4,14,0.7);z-index:60;align-items:center;justify-content:center;padding:24px\">\n    <div data-answer=\"\" onclick=\"{{ stopProp }}\" style=\"background:color-mix(in srgb,var(--paper,#05070f) 55%,#16276e);border:2px solid #2e6bff;box-shadow:0 6px 0 rgba(0,0,0,0.45),0 28px 70px rgba(0,0,0,0.55);max-width:540px;width:100%;padding:26px 28px 22px\">\n      <div style=\"font-family:'Poppins',sans-serif;font-weight:700;font-size:11px;letter-spacing:2.5px;color:var(--ink,#f04fd6);margin-bottom:10px\">HOLD ON —<\u002Fdiv>\n      <h3 style=\"margin:0 0 10px;font-family:'Poppins',sans-serif;font-weight:600;font-size:21px;letter-spacing:-0.4px;color:#ffffff\">Dismiss without rating?<\u002Fh3>\n      <p style=\"margin:0 0 20px;font-size:14.5px;line-height:1.65;color:#d3dbff\">Ratings route straight back into the manual’s index and genuinely improve answer quality — one click really helps us.<\u002Fp>\n      <div style=\"font-family:'Poppins',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:2.5px;color:var(--ink,#f04fd6);margin-bottom:10px\">RATE NOW<\u002Fdiv>\n      <div class=\"raterow\" style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px\">\n        <button class=\"rdown\" onclick=\"{{ popupRateDown }}\" style=\"background:{{ downBg }};color:{{ downColor }};border:2px solid rgba(255,255,255,0.4);box-shadow:0 4px 0 rgba(0,0,0,0.45);font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;padding:10px 16px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:9px\"><svg aria-hidden=\"true\" viewBox=\"0 0 512 435\" width=\"18\" height=\"15\" fill=\"none\" style=\"flex:none;display:block;transform:rotate(180deg)\"><rect x=\"20\" y=\"178\" width=\"79\" height=\"237\" stroke=\"currentColor\" stroke-width=\"40\"><\u002Frect><rect x=\"158\" y=\"158\" width=\"39\" height=\"237\" fill=\"currentColor\"><\u002Frect><rect x=\"473\" y=\"158\" width=\"39\" height=\"197\" fill=\"currentColor\"><\u002Frect><rect x=\"197\" y=\"118\" width=\"40\" height=\"40\" fill=\"currentColor\"><\u002Frect><rect x=\"434\" y=\"356\" width=\"38\" height=\"39\" fill=\"currentColor\"><\u002Frect><rect x=\"236\" y=\"79\" width=\"40\" height=\"39\" fill=\"currentColor\"><\u002Frect><rect x=\"276\" width=\"39\" height=\"78\" fill=\"currentColor\"><\u002Frect><rect x=\"315\" width=\"79\" height=\"39\" fill=\"currentColor\"><\u002Frect><rect x=\"355\" y=\"39\" width=\"39\" height=\"79\" fill=\"currentColor\"><\u002Frect><rect x=\"315\" y=\"118\" width=\"158\" height=\"40\" fill=\"currentColor\"><\u002Frect><rect x=\"198\" y=\"395\" width=\"235\" height=\"40\" fill=\"currentColor\"><\u002Frect><\u002Fsvg>NEEDS WORK<\u002Fbutton>\n        <button class=\"rup\" onclick=\"{{ popupRateUp }}\" style=\"background:{{ upBg }};color:{{ upColor }};border:none;box-shadow:0 4px 0 rgba(0,0,0,0.45);font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;padding:12px 16px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:9px\"><svg aria-hidden=\"true\" viewBox=\"0 0 512 435\" width=\"18\" height=\"15\" fill=\"none\" style=\"flex:none;display:block\"><rect x=\"20\" y=\"178\" width=\"79\" height=\"237\" stroke=\"currentColor\" stroke-width=\"40\"><\u002Frect><rect x=\"158\" y=\"158\" width=\"39\" height=\"237\" fill=\"currentColor\"><\u002Frect><rect x=\"473\" y=\"158\" width=\"39\" height=\"197\" fill=\"currentColor\"><\u002Frect><rect x=\"197\" y=\"118\" width=\"40\" height=\"40\" fill=\"currentColor\"><\u002Frect><rect x=\"434\" y=\"356\" width=\"38\" height=\"39\" fill=\"currentColor\"><\u002Frect><rect x=\"236\" y=\"79\" width=\"40\" height=\"39\" fill=\"currentColor\"><\u002Frect><rect x=\"276\" width=\"39\" height=\"78\" fill=\"currentColor\"><\u002Frect><rect x=\"315\" width=\"79\" height=\"39\" fill=\"currentColor\"><\u002Frect><rect x=\"355\" y=\"39\" width=\"39\" height=\"79\" fill=\"currentColor\"><\u002Frect><rect x=\"315\" y=\"118\" width=\"158\" height=\"40\" fill=\"currentColor\"><\u002Frect><rect x=\"198\" y=\"395\" width=\"235\" height=\"40\" fill=\"currentColor\"><\u002Frect><\u002Fsvg>USEFUL<\u002Fbutton>\n        <span style=\"display:{{ ratedDisp }};font-family:'Poppins',sans-serif;font-weight:600;font-size:11.5px;color:var(--ink,#f04fd6)\">✓ logged — thank you<\u002Fspan>\n      <\u002Fdiv>\n      <button onclick=\"{{ reallyDismiss }}\" style=\"background:transparent;border:none;padding:0;font-family:'Poppins',sans-serif;font-size:12px;color:#aebaf0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left\">No, I really just want to dismiss this answer.<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f04fd6&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#f04fd6&quot;,&quot;#2e6bff&quot;,&quot;#8a5cff&quot;,&quot;#22d3ee&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;paper&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#05070f&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#05070f&quot;,&quot;#060a1c&quot;,&quot;#03103d&quot;,&quot;#0a1027&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;gridLines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  state = { page:'cover', query:'', answered:false, answer:null, rating:null, hl:0, confirmOpen:false, activeField:null };\n\n  componentDidMount(){\n    const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if(rm){ this.setState({ hl:3 }); return; }\n    this._hlTimer = setInterval(()=>{ this.setState(s=>({ hl:(s.hl+1)%6 })); }, 1500);\n  }\n  componentWillUnmount(){ if(this._hlTimer){ clearInterval(this._hlTimer); } if(this._dnTimer){ clearTimeout(this._dnTimer); } }\n\n  popupRate(dir){\n    this.setState({ rating:dir });\n    if(this._dnTimer){ clearTimeout(this._dnTimer); }\n    this._dnTimer = setTimeout(()=>{ this.setState({ answered:false, answer:null, rating:null, confirmOpen:false }); }, 850);\n  }\n\n  mix(a,b,t){\n    const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];\n    const A=p(a),B=p(b);\n    return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');\n  }\n\n  sectionDefs(){\n    return [\n      {id:'cover',num:'00',name:'COVER & ASK'},\n      {id:'why',num:'01',name:'WHY WE NEED A MANUAL'},\n      {id:'start',num:'02',name:'GETTING STARTED'},\n      {id:'rewards',num:'03',name:'REWARDS & REFERRALS'},\n      {id:'revenue',num:'04',name:'NETWORK REVENUE'},\n      {id:'symm',num:'05',name:'SYMM CLEARING'},\n      {id:'glossary',num:'06',name:'GLOSSARY'},\n    ];\n  }\n\n  canned(){\n    return [\n      {match:['referral point','points credit','when do','credit'],ans:{kind:'routed answer',score:'question-route:118',title:'When referral points credit',body:'Referral points accrue continuously as your invitees trade, but they settle to your balance at the close of each epoch (00:00 UTC). A point is final only once the underlying fill is settled on the SYMM clearing layer — pending fills show as provisional and may revise before the epoch finalizes.',source:'vibe-manual / §02 referrals',confidence:'High'}},\n      {match:['revenue','calculated','how is my revenue','payout'],ans:{kind:'routed answer',score:'question-route:204',title:'How network revenue is calculated',body:'Your network revenue is your share of the protocol fees generated by every trade routed through your referral graph, weighted by your tier and net of solver rebates. The full figure — fee routing, the split, and the payout formula — is plotted in §03, FIG_031.',source:'vibe-manual / §03 network revenue',confidence:'High'}},\n      {match:['counter','not moving','live counter','stuck','paused'],ans:{kind:'routed answer',score:'question-route:151',title:'Why the live counter pauses',body:'The live counter reflects settled fills only. During low-volume windows, or while a block is still reaching finality on the clearing layer, it will appear to pause. It resumes automatically on the next finalized fill — no action is required.',source:'vibe-manual / §04 clearing',confidence:'Medium'}},\n      {match:['invite','more invites','invite slot'],ans:{kind:'routed answer',score:'question-route:133',title:'Earning more invite slots',body:'Invite allocation scales with your tier and with the activity of the graph you have already built. Each epoch, active invitees unlock additional slots; dormant branches do not. Tiers and slot mechanics are defined in §02.',source:'vibe-manual / §02 referrals',confidence:'Medium'}},\n    ];\n  }\n\n  ask(text){\n    const q=(text||'').trim();\n    if(!q){ return; }\n    const k=q.toLowerCase();\n    let a=null;\n    for(const c of this.canned()){ if(c.match.some(m=>k.includes(m))){ a=c.ans; break; } }\n    if(!a){\n      a={kind:'routed answer',score:'question-route:'+(100+(q.length*13)%180),title:'Routed to nearest entry',body:'No exact manual entry matched \\u201C'+q+'\\u201D. The closest indexed material is the Network Revenue chapter (§03), which covers fee routing, payout timing, and the live counter. Open the section for the full figure set, or refine your question.',source:'vibe-manual / index',confidence:'Low'};\n    }\n    this.setState({ page:'cover', query:q, answered:true, answer:a, rating:null, confirmOpen:false });\n  }\n\n  renderVals(){\n    const ink = this.props.accent || '#f04fd6';\n    const paper = this.props.paper || '#05070f';\n    const grid = (this.props.gridLines !== undefined ? this.props.gridLines : true);\n    const gridc = grid ? 'rgba(255,255,255,0.07)' : 'transparent';\n    const page = this.state.page;\n\n    const okHex = c => (typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c)) ? c : null;\n    const inkH = okHex(ink) || '#f04fd6';\n    const paperH = okHex(paper) || '#05070f';\n    const mk = (i) => {\n      const on = this.state.hl === i;\n      return on\n        ? { f1:this.mix(inkH,'#000000',0.30), f2:this.mix(inkH,'#000000',0.48), f3:inkH, stroke:'#ffffff', sw:'2', nameFill:'#ffffff', nameW:'700', subFill:inkH }\n        : { f1:this.mix(paperH,'#2e6bff',0.20), f2:this.mix(paperH,'#2e6bff',0.12), f3:this.mix(paperH,'#2e6bff',0.36), stroke:'#7ea0ff', sw:'1.6', nameFill:'#aebaf0', nameW:'400', subFill:'#6f7fc9' };\n    };\n\n    const defs = this.sectionDefs();\n    const cur = defs.find(d => d.id === page) || defs[0];\n\n    const chipText = [\n      'When do referral points credit?',\n      'How is my revenue calculated?',\n      'Why is my live counter not moving?',\n      'How do I get more invites?',\n    ];\n    const chips = chipText.map(label => ({ label, go:()=>this.ask(label) }));\n\n    const owner = this.state.activeField;\n    const ghost = (me) => !!(owner && owner !== me && this.state.query.length > 0);\n    const mkField = (me, ph) => ({ val: ghost(me) ? '' : this.state.query, disp: ghost(me) ? 'flex' : 'none', ph: ghost(me) ? '' : ph });\n    const fSide = mkField('side','Search —');\n    const fTop = mkField('top','Ask the manual —');\n    const fCover = mkField('cover','Ask anything — points, invites, revenue, payouts…');\n\n    return {\n      sideVal:fSide.val, sideGhost:fSide.disp, sidePh:fSide.ph,\n      topVal:fTop.val, topGhost:fTop.disp, topPh:fTop.ph,\n      coverVal:fCover.val, coverGhost:fCover.disp, coverPh:fCover.ph,\n      focusSide:()=>this.setState({activeField:'side'}), blurSide:()=>this.setState(s=>s.activeField==='side'?{activeField:null}:null),\n      focusTop:()=>this.setState({activeField:'top'}), blurTop:()=>this.setState(s=>s.activeField==='top'?{activeField:null}:null),\n      focusCover:()=>this.setState({activeField:'cover'}), blurCover:()=>this.setState(s=>s.activeField==='cover'?{activeField:null}:null),\n      ink, paper, gridc,\n      L1:mk(0), L2:mk(1), L3:mk(2), L4:mk(3), L5:mk(4), L6:mk(5),\n      curNum:cur.num, curName:cur.name,\n      coverDisp:page==='cover'?'flex':'none', whyDisp:page==='why'?'block':'none', startDisp:page==='start'?'block':'none', rewardsDisp:page==='rewards'?'block':'none', revenueDisp:page==='revenue'?'block':'none', symmDisp:page==='symm'?'block':'none', glossaryDisp:page==='glossary'?'block':'none', ansDisp:this.state.answered?'block':'none',\n      goCover:()=>this.setState({page:'cover'}), goWhy:()=>this.setState({page:'why'}), goStart:()=>this.setState({page:'start'}), goRewards:()=>this.setState({page:'rewards'}), goRevenue:()=>this.setState({page:'revenue'}), goSymm:()=>this.setState({page:'symm'}), goGlossary:()=>this.setState({page:'glossary'}),\n      aCover:page==='cover'?'true':'false', aWhy:page==='why'?'true':'false', aStart:page==='start'?'true':'false', aRewards:page==='rewards'?'true':'false', aRevenue:page==='revenue'?'true':'false', aSymm:page==='symm'?'true':'false', aGlossary:page==='glossary'?'true':'false',\n      chips,\n      query:this.state.query,\n      onQuery:(e)=>this.setState({ query:e.target.value }),\n      onSubmit:(e)=>{ e.preventDefault(); this.ask(this.state.query); },\n      answered:this.state.answered,\n      answer:this.state.answer || {kind:'',score:'',title:'',body:'',source:'',confidence:''},\n      clearAnswer:()=>{ if(this.state.rating){ this.setState({ answered:false, answer:null, rating:null, confirmOpen:false }); } else { this.setState({ confirmOpen:true }); } },\n      confirmDisp: this.state.confirmOpen ? 'flex' : 'none',\n      cancelConfirm: ()=>this.setState({ confirmOpen:false }),\n      stopProp: (e)=>e.stopPropagation(),\n      reallyDismiss: ()=>this.setState({ answered:false, answer:null, rating:null, confirmOpen:false }),\n      popupRateUp: ()=>this.popupRate('up'),\n      popupRateDown: ()=>this.popupRate('down'),\n      askDisp: this.state.answered ? 'none' : 'block',\n      askFlexDisp: this.state.answered ? 'none' : 'flex',\n      ratedDisp: this.state.rating ? 'inline-block' : 'none',\n      rateUp: ()=>this.setState({ rating:'up' }),\n      rateDown: ()=>this.setState({ rating:'down' }),\n      upBg: this.state.rating==='up' ? '#ffffff' : 'var(--ink,#f04fd6)',\n      upColor: this.state.rating==='up' ? '#0a1440' : '#fff',\n      downBg: this.state.rating==='down' ? '#ffffff' : 'transparent',\n      downColor: this.state.rating==='down' ? '#0a1440' : '#ffffff',\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
